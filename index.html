<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Money Tracker</title>
  <meta name="description" content="Record what you spend. Everything stays on this device.">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#F2F4F1" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#131816" media="(prefers-color-scheme: dark)">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Money">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="css/styles.css">
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <header class="topbar">
    <h1 class="app-title">Money Tracker</h1>
    <div class="topbar-actions">
      <button type="button" id="install-btn" class="pill-btn" hidden>Install app</button>
      <button type="button" id="notes-btn" class="pill-btn">Notes</button>
    </div>
  </header>

  <!-- Home -->
  <main id="view-home" class="view">
    <section class="totals" aria-label="Totals">
      <p class="total-label">Total spent</p>
      <p class="total-amount" id="total-all">₹0</p>
      <div class="month-row">
        <p class="total-label">This month</p>
        <p class="month-amount" id="total-month">₹0</p>
      </div>
    </section>

    <section aria-labelledby="recent-title">
      <div class="section-head">
        <h2 id="recent-title">Recent</h2>
        <button type="button" class="link-btn" id="see-all" hidden>See all</button>
      </div>
      <ul class="tx-list" id="recent-list"></ul>
      <p class="hint" id="edit-hint" hidden>Tap an expense to edit or delete it.</p>
    </section>
  </main>

  <!-- All expenses -->
  <main id="view-all" class="view" hidden>
    <div class="section-head">
      <button type="button" class="link-btn back-btn">
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        Back
      </button>
    </div>

    <section aria-labelledby="cat-title" id="cat-section">
      <h2 id="cat-title">This month by category</h2>
      <div id="category-totals"></div>
    </section>

    <section aria-labelledby="all-title">
      <h2 id="all-title">All expenses</h2>
      <div id="month-groups"></div>
    </section>
  </main>

  <!-- Notes -->
  <main id="view-notes" class="view" hidden>
    <div class="section-head">
      <button type="button" class="link-btn back-btn">
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        Back
      </button>
      <small class="note-status" id="note-status" aria-live="polite"></small>
    </div>
    <h2 class="notes-title"><label for="note-text">Notes</label></h2>
    <textarea id="note-text" class="input note-input" autocapitalize="sentences"
              placeholder="Write anything you want to remember."></textarea>
    <p class="hint">Saves automatically on this device.</p>
  </main>

  <!-- Sticky add button -->
  <div class="add-bar" id="add-bar">
    <button type="button" class="add-btn" id="add-btn">
      <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/></svg>
      Add expense
    </button>
  </div>

  <!-- Add / edit sheet -->
  <dialog id="expense-sheet" class="sheet" aria-labelledby="sheet-title" tabindex="-1">
    <form id="expense-form" class="sheet-form" novalidate>
      <div class="sheet-handle" aria-hidden="true"></div>
      <h2 id="sheet-title">Add expense</h2>

      <div class="field">
        <label for="f-amount">Amount</label>
        <div class="amount-wrap">
          <span class="currency" aria-hidden="true">₹</span>
          <input id="f-amount" name="amount" class="input input-amount" inputmode="decimal"
                 autocomplete="off" placeholder="0" aria-describedby="e-amount" required>
        </div>
        <small class="error" id="e-amount" aria-live="polite"></small>
      </div>

      <div class="field">
        <label for="f-description">Description</label>
        <input id="f-description" name="description" class="input" maxlength="80"
               autocomplete="off" autocapitalize="sentences" placeholder="Lunch"
               enterkeyhint="done" aria-describedby="e-description" required>
        <small class="error" id="e-description" aria-live="polite"></small>
      </div>

      <div class="field">
        <label for="f-category">Category <span class="optional">(optional)</span></label>
        <div class="select-wrap">
          <select id="f-category" name="category" class="input">
            <option value="">No category</option>
          </select>
        </div>
      </div>

      <div class="field">
        <label for="f-date">Date</label>
        <input id="f-date" name="date" type="date" class="input" aria-describedby="e-date" required>
        <small class="error" id="e-date" aria-live="polite"></small>
      </div>

      <div class="sheet-actions">
        <button type="submit" class="btn btn-primary" id="save-btn">Save expense</button>
        <button type="button" class="btn btn-secondary" id="cancel-btn">Cancel</button>
        <button type="button" class="btn btn-danger" id="delete-btn" hidden>Delete expense</button>
      </div>
    </form>
  </dialog>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
</body>
</html>
